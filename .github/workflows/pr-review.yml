name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run AI review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git diff origin/${{ github.base_ref }}...HEAD | bash review-pr.sh > findings.json || echo "[]" > findings.json

      - name: Post review
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');

            let findings;
            try {
              findings = JSON.parse(fs.readFileSync('findings.json', 'utf8'));
            } catch {
              core.warning('AI review output is not valid JSON — skipping.');
              return;
            }

            if (findings.length === 0) {
              await github.rest.pulls.createReview({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                event: 'COMMENT',
                body: '✅ **AI Review** — aucun problème détecté.',
              });
              return;
            }

            const criticals = findings.filter(f => f.severity === 'critical');
            const icon = { critical: '🚨', warning: '⚠️', info: 'ℹ️' };

            const rows = findings
              .map(f => `| ${icon[f.severity] ?? ''} \`${f.severity}\` | \`${f.file}:${f.line}\` | \`${f.category}\` | ${f.message.replace(/\|/g, '\\|')} |`)
              .join('\n');

            const header = criticals.length > 0
              ? `🚨 **${criticals.length} finding(s) critique(s) — PR bloquée.**`
              : `⚠️ **${findings.length} finding(s) — aucun critique (non bloquant).**`;

            const body = [
              '## AI Review',
              '',
              header,
              '',
              '| Sévérité | Fichier | Catégorie | Message |',
              '|---|---|---|---|',
              rows,
            ].join('\n');

            await github.rest.pulls.createReview({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              event: criticals.length > 0 ? 'REQUEST_CHANGES' : 'COMMENT',
              body,
            });

            if (criticals.length > 0) {
              core.setFailed(`${criticals.length} finding(s) critique(s) détecté(s) — PR bloquée.`);
            }
