<div class="flex items-center justify-center min-h-screen bg-gray-100">
  <mat-card class="w-96 shadow-lg">
    <mat-card-header class="mb-2">
      <mat-card-title>Connexion</mat-card-title>
      <mat-card-subtitle>Système de réservation</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-col gap-4 pt-2">
        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
          <mat-label>Email</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
          <mat-error>Email valide requis</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" subscriptSizing="dynamic" class="w-full">
          <mat-label>Mot de passe</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="current-password" />
          <mat-error>Mot de passe requis</mat-error>
        </mat-form-field>

        @if (error()) {
          <p class="text-red-600 text-sm">{{ error() }}</p>
        }

        <button mat-flat-button color="primary" type="submit" [disabled]="isLoading()" class="w-full">
          {{ isLoading() ? 'Connexion en cours…' : 'Se connecter' }}
        </button>
      </form>
    </mat-card-content>

    <mat-card-footer class="px-4 pb-4 text-xs text-gray-400">
      Comptes de démo&nbsp;: staff&#64;restaurant.fr / password
    </mat-card-footer>
  </mat-card>
</div>
